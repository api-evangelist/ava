aid: ava
name: Ava
description: >-
  Ava is a consumer financial-technology company that helps people build credit
  and reduce the cost of debt. Its products include the Ava Credit Builder
  Mastercard (a no-interest card usable at approved subscription merchants), a
  Save & Build secured savings loan, and rent and utility payment reporting to
  the three major U.S. credit bureaus (TransUnion, Equifax, Experian). Ava
  operates as a mobile app on a subscription model and partners with regulated
  banks and lenders (including Patriot Bank, N.A. and Pier Lending) to deliver
  its products. This profile was surfaced as a Greylock portfolio company and
  enriched by the API Evangelist pipeline; Ava is a consumer app and does not
  publish a public developer API.
